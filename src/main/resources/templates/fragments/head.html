<!-- Fragmento reutilizable: <head> comun a todas las paginas -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${titulo} + ' · Caja Piura'">Caja Piura</title>
    <meta name="description" content="Pre-evaluación digital de créditos de Caja Piura: conoce tu resultado preliminar en minutos, sin ir a la agencia." />
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <script th:src="@{/js/ui.js}" defer></script>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
</head>
