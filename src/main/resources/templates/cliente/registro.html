<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Crear cuenta')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<section class="section-tight">
    <div class="container-narrow" style="max-width:560px;">
        <div class="section-head center" style="margin-left:auto;margin-right:auto;">
            <span class="section-kicker">Portal del cliente</span>
            <h2>Crea tu cuenta</h2>
            <p>Con tu cuenta podrás simular tu crédito, enviar tu pre-evaluación y seguir su estado.</p>
        </div>

        <form class="form-card" th:action="@{/cliente/registro}" method="post" novalidate>
            <div th:if="${errores}" class="alert err">
                <strong>Revisa los siguientes puntos:</strong>
                <ul style="margin:8px 0 0 18px;">
                    <li th:each="e : ${errores}" th:text="${e}">Error</li>
                </ul>
            </div>

            <div class="field">
                <label for="nombreCompleto">Nombre completo</label>
                <input type="text" id="nombreCompleto" name="nombreCompleto" th:value="${nombreCompleto}" maxlength="120" autocomplete="name" required />
            </div>
            <div class="field">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" th:value="${correo}" maxlength="150" autocomplete="email" required />
                <div class="hint">Será tu usuario para ingresar.</div>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required />
                <div class="hint">Mínimo 8 caracteres, con mayúscula, minúscula y número.</div>
            </div>
            <div class="field">
                <label for="confirmar">Repite la contraseña</label>
                <input type="password" id="confirmar" name="confirmar" autocomplete="new-password" required />
            </div>

            <div class="consent">
                <label><input type="checkbox" name="aceptaDatos" value="true" required />
                    <span>Autorizo el tratamiento de mis datos personales para evaluar mi solicitud de crédito, conforme a la Ley N.° 29733, Ley de Protección de Datos Personales. <a href="/privacidad" target="_blank" rel="noopener">Ver política de privacidad</a>.</span></label>
                <label><input type="checkbox" name="aceptaTerminos" value="true" required />
                    <span>Acepto los términos y condiciones de uso de la plataforma. Entiendo que el resultado es preliminar y no es una aprobación crediticia.</span></label>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Crear mi cuenta</button>
            <p class="text-center text-muted" style="margin-top:16px;">¿Ya tienes cuenta? <a href="/cliente/login"><strong>Ingresa</strong></a></p>
        </form>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
