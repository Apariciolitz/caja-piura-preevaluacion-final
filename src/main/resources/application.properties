# Caja Piura - Pre-evaluacion Digital de Creditos
spring.application.name=preevaluacion-creditos

# Puerto: Render/Railway inyectan PORT; en local usa 8080
server.port=${PORT:8080}

# Base de datos H2 en archivo (persiste entre reinicios del proceso).
# En plataformas con disco efimero (ej. Render free) se reinicia en cada despliegue,
# lo cual es aceptable para una demo academica.
spring.datasource.url=jdbc:h2:file:./data/cajapiura;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Consola H2: DESACTIVADA por defecto (INC-01). Solo para desarrollo local: H2_CONSOLE=true
spring.h2.console.enabled=${H2_CONSOLE:false}
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false

# Contrasenas iniciales de las cuentas de demostracion (si no se definen, se generan al azar y se muestran en el log)
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.asesor-password=${SEED_ASESOR_PASSWORD:}

# Carpeta donde se guardan los documentos adjuntos (DNI, sustento de ingresos)
app.uploads.dir=${UPLOADS_DIR:./uploads}

# Tamano maximo de subida de documentos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

logging.level.org.springframework.security=INFO
