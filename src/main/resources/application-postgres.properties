# Perfil "postgres": se activa con SPRING_PROFILES_ACTIVE=postgres
# (Docker Compose lo hace automáticamente). Sustituye a H2.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cajapiura}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:cajapiura}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea/actualiza las tablas al arrancar (aceptable para el proyecto académico;
# en producción real se usarían migraciones versionadas con Flyway).
spring.jpa.hibernate.ddl-auto=update

# Pool de conexiones pequeño: alcanza para la demo y respeta los límites de planes gratuitos.
spring.datasource.hikari.maximum-pool-size=5

# La consola H2 no aplica con Postgres.
spring.h2.console.enabled=false
